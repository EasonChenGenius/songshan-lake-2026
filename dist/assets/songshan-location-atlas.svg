<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 670" role="img" aria-labelledby="title desc">
  <title id="title">松山湖片区经纬度地标图</title>
  <desc id="desc">六处地点按 WGS-84 坐标在东西、南北方向等比例投影：悠兰里位于图上方，机器人研究院与大湾区大学位于左侧，华为园区居中，中国散裂中子源与东莞材料所位于右下方。底纹不代表真实道路。</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12353a"/><stop offset=".54" stop-color="#0c282f"/><stop offset="1" stop-color="#071d29"/></linearGradient>
    <radialGradient id="lake" cx=".38" cy=".57" r=".48"><stop stop-color="#347e87" stop-opacity=".38"/><stop offset="1" stop-color="#224f5d" stop-opacity="0"/></radialGradient>
    <linearGradient id="border" x1="0" x2="1"><stop stop-color="#d7caaa" stop-opacity=".6"/><stop offset="1" stop-color="#82c9ca" stop-opacity=".35"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".4"/></filter>
    <g id="pin"><circle r="19" fill="#e2be84" fill-opacity=".13"/><circle r="12" fill="#0c2a34" stroke="#e8c596" stroke-width="2"/><circle r="4" fill="#f5d2a2"/></g>
  </defs>
  <rect width="860" height="670" rx="26" fill="url(#base)"/>
  <rect width="860" height="670" rx="26" fill="url(#lake)"/>
  <path d="M210 490C288 420 289 306 392 269c86-32 163 32 147 137-14 89-156 159-242 135-41-12-80-32-87-51z" fill="#2c7980" opacity=".13" filter="url(#blur)"/>
  <g stroke="#afc5b9" stroke-opacity=".18" stroke-width="1.2" fill="none">
    <path d="M181 67V623M349 67V623M518 67V623M686 67V623"/>
    <path d="M70 147H795M70 293H795M70 511H795"/>
  </g>
  <g font-family="Georgia,serif" font-size="13" letter-spacing="2" fill="#aec8c2" opacity=".78">
    <text x="183" y="50" text-anchor="middle">113.85°E</text><text x="517" y="50" text-anchor="middle">113.90°E</text><text x="686" y="50" text-anchor="middle">113.925°E</text>
    <text x="19" y="150">22.92°N</text><text x="19" y="296">22.90°N</text><text x="19" y="514">22.87°N</text>
  </g>
  <g opacity=".55" fill="none" stroke="#c9dfd6" stroke-width="1.4">
    <path d="M76 86h30M91 71v30M755 91h30M770 76v30"/>
    <path d="M770 153v-45m0 0-9 15m9-15 9 15"/>
  </g>
  <text x="767" y="97" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#f2e5d1">N</text>
  <text x="434" y="369" font-family="Songti SC,serif" text-anchor="middle" font-size="32" letter-spacing="6" fill="#8ed0c9" opacity=".23">松山湖片区</text>
  <g font-family="Songti SC,serif" font-size="17" fill="#eff7ee" filter="url(#shadow)">
    <use href="#pin" x="391" y="105"/><path d="M410 105h12" stroke="#d7c49f" stroke-opacity=".7"/><text x="430" y="111">06 悠兰里</text>
    <use href="#pin" x="249" y="258"/><path d="M266 258h16" stroke="#d7c49f" stroke-opacity=".7"/><text x="290" y="264">03 智能机器人研究院</text>
    <use href="#pin" x="184" y="322"/><path d="M181 338l-23 15" stroke="#d7c49f" stroke-opacity=".7"/><text x="101" y="376">04 大湾区大学</text>
    <use href="#pin" x="397" y="402"/><path d="M412 410l26 16" stroke="#d7c49f" stroke-opacity=".7"/><text x="449" y="438">05 华为园区</text>
    <use href="#pin" x="726" y="476"/><path d="M712 462l-24-26" stroke="#d7c49f" stroke-opacity=".7"/><text x="591" y="428">02 东莞材料所</text>
    <use href="#pin" x="623" y="538"/><path d="M610 554l-21 21" stroke="#d7c49f" stroke-opacity=".7"/><text x="468" y="592">01 中国散裂中子源</text>
  </g>
  <g fill="#abc6c1" font-family="Georgia,serif" font-size="11" letter-spacing="1.8">
    <text x="38" y="645">LOCATION ATLAS / WGS-84 POINT PLOT</text>
    <text x="821" y="645" text-anchor="end">NOT FOR NAVIGATION</text>
  </g>
  <rect x="1" y="1" width="858" height="668" rx="25" stroke="url(#border)" stroke-width="2" fill="none"/>
</svg>
