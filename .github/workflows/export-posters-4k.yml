name: Export all four posters in 4K

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-posters-4k.yml
      - scripts/export-poster-images-4k.cjs
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: poster-export-4k
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot renderer and fonts
        run: |
          npm install --prefix "$RUNNER_TEMP/songshan-tools" --no-save playwright sharp
          "$RUNNER_TEMP/songshan-tools/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Render 4K original-size long posters
        env:
          NODE_PATH: ${{ runner.temp }}/songshan-tools/node_modules
        run: |
          python3 -m http.server 4173 --directory dist > "$RUNNER_TEMP/songshan-4k-server.log" 2>&1 &
          node scripts/export-poster-images-4k.cjs
          ls -lh dist/poster-exports-4k/
      - name: Four individually downloadable originals
        uses: actions/upload-artifact@v4
        with:
          name: songshan-four-posters-4k
          path: dist/poster-exports-4k/
          compression-level: 0
          retention-days: 30
      - name: Preserve 4K files in GitHub and publish them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/poster-exports-4k/
          git diff --cached --quiet || git commit -m "Publish four separate 4K poster images"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
