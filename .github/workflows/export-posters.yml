name: Export standalone poster images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-posters.yml
      - scripts/export-poster-images.cjs
      - 'dist/poster-mobile-real-photo/**'
      - 'dist/poster-desktop-real-photo/**'
      - 'dist/assets/poster-mobile-*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: poster-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot renderer
        run: |
          npm install --prefix "$RUNNER_TEMP/songshan-tools" --no-save playwright sharp
          "$RUNNER_TEMP/songshan-tools/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          fc-match "Noto Serif CJK SC"
      - name: Render independent real-photo desktop and iPhone 17 posters
        env:
          NODE_PATH: ${{ runner.temp }}/songshan-tools/node_modules
          POSTER_EXPORT_VARIANTS: poster-desktop-real-photo,poster-mobile-real-photo
        run: |
          python3 -m http.server 4173 --directory dist > "$RUNNER_TEMP/songshan-poster-server.log" 2>&1 &
          node scripts/export-poster-images.cjs
          ls -lh dist/poster-exports/
      - name: Provide separately downloadable backups
        uses: actions/upload-artifact@v4
        with:
          name: poster-desktop-original
          path: dist/poster-exports/poster-desktop.*
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: poster-mobile-original
          path: dist/poster-exports/poster-mobile.*
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: poster-desktop-real-photo-original
          path: dist/poster-exports/poster-desktop-real-photo.*
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: poster-mobile-real-photo-original
          path: dist/poster-exports/poster-mobile-real-photo.*
          compression-level: 0
      - name: Save exported images to the public site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/poster-exports/
          git diff --cached --quiet || git commit -m "Add downloadable desktop and mobile poster originals"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
