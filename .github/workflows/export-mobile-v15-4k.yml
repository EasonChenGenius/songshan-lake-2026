name: Export V15 mobile real-photo poster and 4K chapter PNG package

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-mobile-v15-4k.yml
      - scripts/split-mobile-v15-4k.cjs
      - scripts/export-poster-images-4k.cjs
      - dist/poster-mobile-real-photo/index.html
      - dist/poster-mobile-real-photo/poster.css
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-v15-mobile-real-photo
  cancel-in-progress: false

jobs:
  render-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual browser renderer and Chinese fonts
        run: |
          npm install --prefix "$RUNNER_TEMP/songshan-v15-tools" --no-save playwright sharp
          "$RUNNER_TEMP/songshan-v15-tools/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Render unchanged V15 webpage at full 4K mobile resolution
        env:
          NODE_PATH: ${{ runner.temp }}/songshan-v15-tools/node_modules
          POSTER_EXPORT_VARIANTS: poster-mobile-real-photo
        run: |
          python3 -m http.server 4173 --directory dist > "$RUNNER_TEMP/songshan-v15-server.log" 2>&1 &
          node scripts/export-poster-images-4k.cjs
          test -s dist/poster-exports-4k/poster-mobile-real-photo-4k.png
      - name: Slice the real page by its seven chapter boundaries and create ZIP
        env:
          NODE_PATH: ${{ runner.temp }}/songshan-v15-tools/node_modules
        run: |
          node scripts/split-mobile-v15-4k.cjs
          test -s exports/mobile-real-photo-v15-4k/poster-mobile-real-photo-v15-sections-4k.zip
          find exports/mobile-real-photo-v15-4k -maxdepth 1 -type f -printf '%f %s bytes\\n'
      - name: Archive independently downloadable 4K images
        uses: actions/upload-artifact@v4
        with:
          name: songshan-mobile-real-photo-v15-4k
          path: |
            dist/poster-exports-4k/poster-mobile-real-photo-4k.png
            exports/mobile-real-photo-v15-4k/
          compression-level: 0
          retention-days: 30
      - name: Commit 4K full render, original page slices, and ZIP to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/poster-exports-4k/poster-mobile-real-photo-4k.png exports/mobile-real-photo-v15-4k/
          git diff --cached --quiet || git commit -m "Publish V15 full mobile poster and seven original 4K PNG chapters with ZIP"
          git push origin HEAD:main
